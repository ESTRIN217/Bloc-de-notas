org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+UseSerialGC -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false

# FUERZA A KOTLIN A USAR EL PROCESO DE GRADLE (Evita el doble consumo)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=true
gradle.user.home=/home/user/.gradle
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
